services:
  prosjekt:
    image: ${DOCKER_REGISTRY-}prosjekt
    build:
      context: .
      dockerfile: Prosjekt/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DB_CONNECTION_STRING=${DB_CONNECTION_STRING}
    networks:
      - appnet

networks:
  appnet:
    external: true
    name: appnet