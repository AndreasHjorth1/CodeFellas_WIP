name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test Prosjekt
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Prosjekt

    steps:
      -- name: Restore dependencies
        run: dotnet restore ./Prosjekt.slnx

      - name: Build solution
        run: dotnet build ./Prosjekt.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./Prosjekt.slnx --configuration Release --no-build --no-restore --verbosity normal
